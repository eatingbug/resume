experience:
  - company: 크레버스 (Creverse)
    role: AI Engineer
    period: 2024.05 ~ 현재
    projects:
      - title: LLM 기반 영어 Writing·Speaking 실시간 평가 엔진
        case: realtime-grading
        bullets:
          - rubric 단위로 채점 workflow를 나누고 항목을 병렬로 평가하는 구조로, 원어민 강사가 평균 3.5일 걸려 채점하던 과제 평가를 10초대 실시간 피드백으로 전환
          - 일부 과제부터 성능을 검증하며 단계적으로 확대해 2026년 초 17개 과제 유형 전체에 적용. 누적 55만 건 이상 에세이 평가·월 3만 명 이상 학생 이용 (Speaking은 STT·Vision 인식 결과를 받는 채점 단계 담당)
      - title: 채점 품질 검증 체계
        case: quality-loop
        bullets:
          - 외부 팀 데이터로 초기 평가 데이터셋을 구축하고, 콘텐츠팀 합의 채점으로 Ground Truth를 정의
          - 개발 단계의 엑셀 검수와 운영 단계의 Trace 수동 조회를 Langfuse Annotation 기반 검수로 전환하고, 쌓인 오류 유형을 LLM-as-a-judge(채점 항목 단위 월 2만~5만 건 자동 검증)와 Ground Truth에 반영하는 개선 루프 구축. 사내 성능검수 위원회의 메인 자료로 활용
      - title: LLMOps 플랫폼
        case: prompt-cicd-gate
        bullets:
          - 프롬프트 변경 PR마다 CI에서 기준 버전과의 비교 평가와 임계치 검사를 모두 통과해야 병합되도록 하고, 병합된 프롬프트는 Langfuse에 새 버전으로 등록한 뒤 webhook으로 AI 서버에 반영해 재배포 없이 교체
          - 운영 트래픽 표본을 채점 항목 단위로 LLM-as-a-judge 검증하고 일부를 Human Annotation으로 재검수해 운영 성능을 모니터링. Langfuse Trace로 장애 추적과 비개발자 품질 확인이 가능하도록 전환
          - 성능 평가로 기능별 품질 차이를 검증해 경량 모델 교체·reasoning 단계 조정으로 비용 최적화 (모델 교체 기능 94% 절감)
  - company: ZIPIDA
    role: Software Engineer
    period: 2023.02 ~ 2024.05
    projects:
      - title: 정부 과제 (KISTI · 경찰청)
        bullets:
          - "KISTI: 관제 로그를 분류하는 여러 ML 모델을 관리·서빙하는 플랫폼 개발 (MLflow·MinIO·Temporal). 실제 관제 현장에서 운영하며 개선"
          - "경찰청: 수사 지원 시스템의 자료 수집용 동적 크롤러 개발 (Go). 접근 제한이 있는 사이트에서도 안정적으로 수집"

