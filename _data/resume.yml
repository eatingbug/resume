headline: AI로 비즈니스 문제를 풀고, 운영하며 검증하고 개선하는 AI 엔지니어
summary:
  - 원어민 강사가 평균 3.5일 걸려 채점하던 영어 Writing·Speaking 과제 평가를 채점 기준표(rubric) 기반 LLM 채점 파이프라인으로 자동화해, 10초대 실시간 평가로 바꿨습니다.
  - 운영 중인 AI 응답을 모니터링하고 데이터셋으로 성능을 평가하는 LLMOps 체계를 구축하고, 프롬프트를 재배포 없이 교체할 수 있게 해 평가에서 개선까지의 주기를 짧게 만들었습니다. 이 체계로 경량 모델로도 충분한 기능들을 성능 평가로 가려내 교체했고, 교체한 기능의 비용을 94% 줄였습니다.
  - 비효율을 예측하고 추적할 수 있는 시스템으로 바꿔, 사람이 반복이 아닌 가치 있는 일에 집중하게 만드는 것이 제가 일하는 이유입니다.

